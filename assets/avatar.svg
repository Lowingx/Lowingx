<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="500" fill="#0a0805"/>

  <!-- ensō: um traço, uma abertura -->
  <g transform="translate(250,250) rotate(-14)">
    <circle r="168" fill="none" stroke="#c9a227" stroke-width="16"
            stroke-linecap="round" stroke-dasharray="964 92" stroke-opacity="0.95"/>
    <circle r="160" fill="none" stroke="#8a7530" stroke-width="5"
            stroke-linecap="round" stroke-dasharray="790 216"
            stroke-opacity="0.4" transform="rotate(10)"/>
  </g>

  <!-- selo hanko -->
  <g transform="translate(250,252)">
    <rect x="-56" y="-56" width="112" height="112" fill="#c9a227" rx="8"/>
    <rect x="-48" y="-48" width="96" height="96" fill="none" stroke="#0a0805" stroke-width="2.5" rx="4"/>
    <text x="0" y="4" text-anchor="middle" dominant-baseline="middle"
          font-family="'SimSun','Songti SC','Noto Serif SC',serif" font-size="72"
          fill="#0a0805">脑</text>
  </g>
</svg>
