<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* === GLOW CENTRAL === */
    .glow-core {
      transform-box: view-box;
      transform-origin: 50% 50%;
      animation: glowPulse 5s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 0.8; transform: scale(1.08); }
    }

    /* === LÓTUS === */
    .lotus-outer {
      transform-box: view-box;
      transform-origin: 50% 50%;
      animation: spinCW 40s linear 1.2s infinite;
    }
    @keyframes spinCW { to { transform: rotate(360deg); } }

    .lotus-inner {
      transform-box: view-box;
      transform-origin: 50% 50%;
      animation: spinCCW 30s linear 1.2s infinite;
    }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }

    .lotus-dot {
      transform-box: view-box;
      transform-origin: 50% 50%;
      animation: glowPulse 3.5s ease-in-out 1.8s infinite;
    }

    /* === REDE NEURAL — BASE === */
    .neural-base { opacity: 0; animation: fadeIn 2s ease-out 0.4s forwards; }

    /* === REDE NEURAL — PULSO PRINCIPAL === */
    .np {
      stroke-dasharray: 5 600;
      animation: flowIn 3.5s linear infinite;
    }
    @keyframes flowIn { to { stroke-dashoffset: -605; } }

    /* === REDE NEURAL — PULSO SUB-RAMO === */
    .nps {
      stroke-dasharray: 4 600;
      animation: flowIn 4.5s linear infinite;
    }

    /* === NÓS === */
    .node { animation: nodeBlink 3s ease-in-out infinite; }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.2; }
      50%      { opacity: 0.85; }
    }

    /* === CRUZAMENTOS === */
    .cross { opacity: 0; animation: fadeIn 1.5s ease-out 1s forwards; }

    /* === ÓRBITAS === */
    .orbit { opacity: 0; animation: fadeIn 2s ease-out 0.6s forwards; }

    /* === LÓTUS APARECE === */
    .lotus-group { opacity: 0; animation: fadeIn 1.5s ease-out 0.8s forwards; }

    /* === CENTRO APARECE === */
    .center-node { opacity: 0; animation: fadeIn 1s ease-out 1.4s forwards; }

    /* === VIGNETTE === */
    .vignette { opacity: 0; animation: fadeIn 2.5s ease-out 0.2s forwards; }

    /* === FADE GENÉRICO === */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* === REDUCED MOTION === */
    @media (prefers-reduced-motion: reduce) {
      .glow-core, .lotus-outer, .lotus-inner, .lotus-dot,
      .neural-base, .np, .nps, .node, .cross, .orbit,
      .lotus-group, .center-node, .vignette {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .np, .nps {
        stroke-dasharray: none !important;
        stroke-dashoffset: 0 !important;
      }
    }
  </style>

  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%"   stop-color="#14100a"/>
      <stop offset="55%"  stop-color="#0a0805"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c9a227" stop-opacity="0.45"/>
      <stop offset="35%"  stop-color="#c9a227" stop-opacity="0.15"/>
      <stop offset="70%"  stop-color="#c9a227" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowW" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f0d860" stop-opacity="0.6"/>
      <stop offset="40%"  stop-color="#e8c84a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="52%">
      <stop offset="45%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="fBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22"/>
    </filter>
    <filter id="fMed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
    <filter id="fSm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ======= FUNDO ======= -->
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- ======= GLOW CENTRAL ======= -->
  <g class="glow-core">
    <circle cx="300" cy="300" r="280" fill="url(#glowG)" filter="url(#fBig)"/>
    <circle cx="300" cy="300" r="140" fill="url(#glowW)" filter="url(#fMed)"/>
    <circle cx="300" cy="300" r="55" fill="#f0d860" opacity="0.04"/>
  </g>

  <!-- ======= ÓRBITAS SUTIS ======= -->
  <g class="orbit">
    <circle cx="300" cy="300" r="100" fill="none" stroke="#c9a227" stroke-width="0.4" opacity="0.08"/>
    <circle cx="300" cy="300" r="180" fill="none" stroke="#c9a227" stroke-width="0.3" opacity="0.05"/>
    <circle cx="300" cy="300" r="250" fill="none" stroke="#c9a227" stroke-width="0.2" opacity="0.03"/>
  </g>

  <!-- ======= RAMOS NEURAIS — BASE (estática) ======= -->
  <g class="neural-base" fill="none" stroke="#c9a227" stroke-width="0.5" opacity="0.3">
    <!-- 8 ramos principais: extremidade → centro -->
    <path d="M485,280 Q392,272 300,300"/>
    <path d="M450,155 Q375,228 300,300"/>
    <path d="M150,145 Q225,228 300,300"/>
    <path d="M115,300 Q208,292 300,300"/>
    <path d="M140,445 Q220,373 300,300"/>
    <path d="M295,500 Q298,400 300,300"/>
    <path d="M460,445 Q380,373 300,300"/>
    <path d="M305,90 Q302,195 300,300"/>
    <!-- 8 sub-ramos -->
    <path d="M540,250 Q512,262 485,280"/>
    <path d="M505,118 Q478,138 450,155"/>
    <path d="M95,108 Q122,128 150,145"/>
    <path d="M58,315 Q86,305 115,300"/>
    <path d="M88,478 Q112,462 140,445"/>
    <path d="M512,478 Q488,462 460,445"/>
    <path d="M282,555 Q288,530 295,500"/>
    <path d="M312,40 Q308,62 305,90"/>
  </g>

  <!-- ======= RAMOS NEURAIS — PULSO ANIMADO ======= -->
  <g fill="none" stroke="#e8c84a" stroke-width="0.8" stroke-linecap="round">
    <!-- Principais -->
    <path class="np" d="M485,280 Q392,272 300,300" style="animation-delay:0s"/>
    <path class="np" d="M450,155 Q375,228 300,300" style="animation-delay:-0.45s"/>
    <path class="np" d="M150,145 Q225,228 300,300" style="animation-delay:-0.9s"/>
    <path class="np" d="M115,300 Q208,292 300,300" style="animation-delay:-1.35s"/>
    <path class="np" d="M140,445 Q220,373 300,300" style="animation-delay:-1.8s"/>
    <path class="np" d="M295,500 Q298,400 300,300" style="animation-delay:-2.25s"/>
    <path class="np" d="M460,445 Q380,373 300,300" style="animation-delay:-2.7s"/>
    <path class="np" d="M305,90 Q302,195 300,300" style="animation-delay:-3.15s"/>
    <!-- Sub-ramos -->
    <path class="nps" d="M540,250 Q512,262 485,280" style="animation-delay:-0.2s"/>
    <path class="nps" d="M505,118 Q478,138 450,155" style="animation-delay:-0.7s"/>
    <path class="nps" d="M95,108 Q122,128 150,145" style="animation-delay:-1.1s"/>
    <path class="nps" d="M58,315 Q86,305 115,300" style="animation-delay:-1.6s"/>
    <path class="nps" d="M88,478 Q112,462 140,445" style="animation-delay:-2.0s"/>
    <path class="nps" d="M512,478 Q488,462 460,445" style="animation-delay:-2.5s"/>
    <path class="nps" d="M282,555 Q288,530 295,500" style="animation-delay:-2.9s"/>
    <path class="nps" d="M312,40 Q308,62 305,90" style="animation-delay:-3.3s"/>
  </g>

  <!-- ======= CRUZAMENTOS ======= -->
  <g class="cross" fill="none" stroke="#c9a227" stroke-width="0.35" opacity="0.15">
    <path d="M485,280 Q472,215 450,155"/>
    <path d="M150,145 Q125,222 115,300"/>
    <path d="M460,445 Q385,478 295,500"/>
    <path d="M140,445 Q215,478 295,500"/>
    <path d="M485,280 Q485,365 460,445"/>
    <path d="M115,300 Q112,372 140,445"/>
    <path d="M305,90 Q385,118 450,155"/>
    <path d="M305,90 Q220,112 150,145"/>
  </g>

  <!-- ======= LÓTUS ======= -->
  <g class="lotus-group">
    <!-- Pétalas externas (8) — rotação horária -->
    <g class="lotus-outer">
      <path d="M300,210 C322,223 336,263 327,292 C319,309 305,307 300,298 C295,307 281,309 273,292 C264,263 278,223 300,210Z"
            fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.35"/>
      <path d="M300,210 C322,223 336,263 327,292 C319,309 305,307 300,298 C295,307 281,309 273,292 C264,263 278,223 300,210Z"
            fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.35" transform="rotate(45 300 300)"/>
      <path d="M300,210 C322,223 336,263 327,292 C319,309 305,307 300,298 C295,307 281,309 273,292 C264,263 278,223 300,210Z"
            fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.35" transform="rotate(90 300 300)"/>
      <path d="M300,210 C322,223 336,263 327,292 C319,309 305,307 300,298 C295,307 281,309 273,292 C264,263 278,223 300,210Z"
            fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.35" transform="rotate(135 300 300)"/>
      <path d="M300,210 C322,223 336,263 327,292 C319,309 305,307 300,298 C295,307 281,309 273,292 C264,263 278,223 300,210Z"
            fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.35" transform="rotate(180 300 300)"/>
      <path d="M300,210 C322,223 336,263 327,292 C319,309 305,307 300,298 C295,307 281,309 273,292 C264,263 278,223 300,210Z"
            fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.35" transform="rotate(225 300 300)"/>
      <path d="M300,210 C322,223 336,263 327,292 C319,309 305,307 300,298 C295,307 281,309 273,292 C264,263 278,223 300,210Z"
            fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.35" transform="rotate(270 300 300)"/>
      <path d="M300,210 C322,223 336,263 327,292 C319,309 305,307 300,298 C295,307 281,309 273,292 C264,263 278,223 300,210Z"
            fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.35" transform="rotate(315 300 300)"/>
    </g>

    <!-- Pétalas internas (8, offset 22.5°) — rotação anti-horária -->
    <g class="lotus-inner">
      <path d="M300,245 C315,253 323,279 317,297 C311,305 303,303 300,299 C297,303 289,305 283,297 C277,279 285,253 300,245Z"
            fill="#c9a227" opacity="0.1" transform="rotate(22.5 300 300)"/>
      <path d="M300,245 C315,253 323,279 317,297 C311,305 303,303 300,299 C297,303 289,305 283,297 C277,279 285,253 300,245Z"
            fill="#c9a227" opacity="0.1" transform="rotate(67.5 300 300)"/>
      <path d="M300,245 C315,253 323,279 317,297 C311,305 303,303 300,299 C297,303 289,305 283,297 C277,279 285,253 300,245Z"
            fill="#c9a227" opacity="0.1" transform="rotate(112.5 300 300)"/>
      <path d="M300,245 C315,253 323,279 317,297 C311,305 303,303 300,299 C297,303 289,305 283,297 C277,279 285,253 300,245Z"
            fill="#c9a227" opacity="0.1" transform="rotate(157.5 300 300)"/>
      <path d="M300,245 C315,253 323,279 317,297 C311,305 303,303 300,299 C297,303 289,305 283,297 C277,279 285,253 300,245Z"
            fill="#c9a227" opacity="0.1" transform="rotate(202.5 300 300)"/>
      <path d="M300,245 C315,253 323,279 317,297 C311,305 303,303 300,299 C297,303 289,305 283,297 C277,279 285,253 300,245Z"
            fill="#c9a227" opacity="0.1" transform="rotate(247.5 300 300)"/>
      <path d="M300,245 C315,253 323,279 317,297 C311,305 303,303 300,299 C297,303 289,305 283,297 C277,279 285,253 300,245Z"
            fill="#c9a227" opacity="0.1" transform="rotate(292.5 300 300)"/>
      <path d="M300,245 C315,253 323,279 317,297 C311,305 303,303 300,299 C297,303 289,305 283,297 C277,279 285,253 300,245Z"
            fill="#c9a227" opacity="0.1" transform="rotate(337.5 300 300)"/>
    </g>

    <!-- Centro da lótus -->
    <g class="lotus-dot">
      <circle cx="300" cy="300" r="6" fill="#e8c84a" opacity="0.35" filter="url(#fSm)"/>
      <circle cx="300" cy="300" r="2.5" fill="#f0d860" opacity="0.5"/>
    </g>
  </g>

  <!-- ======= NÓS — extremidades principais (r=2.5) ======= -->
  <g fill="#e8c84a" filter="url(#fSm)">
    <circle class="node" cx="485" cy="280" r="2.5" style="animation-delay:0s"/>
    <circle class="node" cx="450" cy="155" r="2.5" style="animation-delay:0.2s"/>
    <circle class="node" cx="150" cy="145" r="2.5" style="animation-delay:0.4s"/>
    <circle class="node" cx="115" cy="300" r="2.5" style="animation-delay:0.6s"/>
    <circle class="node" cx="140" cy="445" r="2.5" style="animation-delay:0.8s"/>
    <circle class="node" cx="295" cy="500" r="2.5" style="animation-delay:1.0s"/>
    <circle class="node" cx="460" cy="445" r="2.5" style="animation-delay:1.2s"/>
    <circle class="node" cx="305" cy="90"  r="2.5" style="animation-delay:1.4s"/>
  </g>

  <!-- ======= NÓS — sub-extremidades (r=1.8) ======= -->
  <g fill="#c9a227">
    <circle class="node" cx="540" cy="250" r="1.8" style="animation-delay:0.3s"/>
    <circle class="node" cx="505" cy="118" r="1.8" style="animation-delay:0.5s"/>
    <circle class="node" cx="95"  cy="108" r="1.8" style="animation-delay:0.7s"/>
    <circle class="node" cx="58"  cy="315" r="1.8" style="animation-delay:0.9s"/>
    <circle class="node" cx="88"  cy="478" r="1.8" style="animation-delay:1.1s"/>
    <circle class="node" cx="512" cy="478" r="1.8" style="animation-delay:1.3s"/>
    <circle class="node" cx="282" cy="555" r="1.8" style="animation-delay:1.5s"/>
    <circle class="node" cx="312" cy="40"  r="1.8" style="animation-delay:1.7s"/>
  </g>

  <!-- ======= NÓS — meio dos ramos (r=1.3) ======= -->
  <g fill="#c9a227" opacity="0.7">
    <circle class="node" cx="393" cy="278" r="1.3" style="animation-delay:0.15s"/>
    <circle class="node" cx="375" cy="228" r="1.3" style="animation-delay:0.35s"/>
    <circle class="node" cx="225" cy="228" r="1.3" style="animation-delay:0.55s"/>
    <circle class="node" cx="208" cy="293" r="1.3" style="animation-delay:0.75s"/>
    <circle class="node" cx="220" cy="373" r="1.3" style="animation-delay:0.95s"/>
    <circle class="node" cx="297" cy="400" r="1.3" style="animation-delay:1.15s"/>
    <circle class="node" cx="380" cy="373" r="1.3" style="animation-delay:1.35s"/>
    <circle class="node" cx="302" cy="195" r="1.3" style="animation-delay:1.55s"/>
  </g>

  <!-- ======= NÓ CENTRAL ======= -->
  <g class="center-node">
    <circle cx="300" cy="300" r="5" fill="#f0d860" opacity="0.25" filter="url(#fMed)"/>
    <circle cx="300" cy="300" r="3" fill="#f0d860" opacity="0.7"/>
    <circle cx="300" cy="300" r="1.2" fill="#fffbe6"/>
  </g>

  <!-- ======= VIGNETTE ======= -->
  <rect class="vignette" width="600" height="600" fill="url(#vig)"/>

  <!-- ======= BORDA ======= -->
  <rect x="1" y="1" width="598" height="598" fill="none" stroke="#c9a227" stroke-opacity="0.06" stroke-width="1" rx="2"/>
</svg>