<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* ===== SOL ===== */
    .sun-rise { opacity: 0; animation: riseUp 1.5s ease-out forwards; }
    @keyframes riseUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .sun-pulse {
      transform-box: view-box;
      transform-origin: 78.3% 48.75%;
      animation: pulse 6.5s ease-in-out 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }

    /* ===== LÓTUS ===== */
    .lotus-outer {
      transform-box: view-box;
      transform-origin: 78.3% 48.75%;
      animation: spinCW 32s linear 1.5s infinite;
    }
    @keyframes spinCW { to { transform: rotate(360deg); } }

    .lotus-inner {
      transform-box: view-box;
      transform-origin: 78.3% 48.75%;
      animation: spinCCW 24s linear 1.5s infinite;
    }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }

    .lotus-center {
      transform-box: view-box;
      transform-origin: 78.3% 48.75%;
      animation: pulse 4s ease-in-out 2s infinite;
    }

    /* ===== ÓRBITAS ===== */
    .orbits { opacity: 0; animation: fadeIn 2s ease-out 0.5s forwards; }
    .synapse { animation: synapseBlink 3s ease-in-out infinite; }
    .synapse:nth-child(2) { animation-delay: 0.5s; }
    .synapse:nth-child(3) { animation-delay: 1s; }
    .synapse:nth-child(4) { animation-delay: 1.5s; }
    .synapse:nth-child(5) { animation-delay: 2s; }
    @keyframes synapseBlink {
      0%, 100% { opacity: 0.15; }
      50%      { opacity: 0.5; }
    }

    /* ===== TEXTO ===== */
    .text-tagline  { opacity: 0; animation: slideUp 0.8s ease-out 0.4s forwards; }
    .text-name     { opacity: 0; animation: slideUp 0.9s ease-out 0.7s forwards; }
    .text-subtitle { opacity: 0; animation: slideUp 0.8s ease-out 1.0s forwards; }
    @keyframes slideUp {
      from { transform: translateY(22px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ===== LINHA DOURADA ===== */
    .gold-line {
      stroke-dasharray: 580;
      stroke-dashoffset: 580;
      animation: drawLine 1.5s ease-out 1.5s forwards;
    }
    @keyframes drawLine { to { stroke-dashoffset: 0; } }

    /* ===== SELO ===== */
    .seal {
      opacity: 0;
      transform-box: view-box;
      transform-origin: 91.67% 15%;
      animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 2.6s forwards;
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    /* ===== RODAPÉ ===== */
    .footer-text { opacity: 0; animation: fadeIn 1s ease-out 3.2s forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ===== BORDA ===== */
    .border-frame { opacity: 0; animation: fadeIn 2s ease-out 2s forwards; }

    /* ===== REDUCED MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      .sun-rise, .sun-pulse, .lotus-outer, .lotus-inner,
      .lotus-center, .orbits, .synapse, .text-tagline,
      .text-name, .text-subtitle, .gold-line, .seal,
      .footer-text, .border-frame {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .gold-line { stroke-dashoffset: 0 !important; }
    }
  </style>

  <defs>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f0d860" stop-opacity="0.95"/>
      <stop offset="30%"  stop-color="#c9a227" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#c9a227" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c9a227" stop-opacity="0.4"/>
      <stop offset="50%"  stop-color="#c9a227" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c9a227"/>
      <stop offset="55%"  stop-color="#e8c84a"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="vigGrad" cx="78%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#c9a227" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0a0805" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28"/>
    </filter>
    <filter id="glowMed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>
    <filter id="glowSm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="400" fill="#0a0805"/>
  <rect width="1200" height="400" fill="url(#vigGrad)" opacity="0.4"/>

  <!-- ===== SOL ===== -->
  <g transform="translate(940,195)">
    <!-- Halo -->
    <g class="sun-rise">
      <circle r="260" fill="url(#sunHalo)" filter="url(#glowBig)"/>
    </g>
    <!-- Corpo -->
    <g class="sun-rise">
      <g class="sun-pulse">
        <circle r="135" fill="url(#sunCore)" filter="url(#glowMed)"/>
        <circle r="75"  fill="#e8c84a" opacity="0.1"/>
        <circle r="38"  fill="#f0d860" opacity="0.07"/>
      </g>
    </g>

    <!-- ===== LÓTUS ===== -->
    <g class="sun-rise">
      <!-- Pétalas externas -->
      <g class="lotus-outer">
        <path d="M0,-82 C20,-70 33,-34 25,-7 C17,8 5,6 0,-2 C-5,6 -17,8 -25,-7 C-33,-34 -20,-70 0,-82Z" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35"/>
        <path d="M0,-82 C20,-70 33,-34 25,-7 C17,8 5,6 0,-2 C-5,6 -17,8 -25,-7 C-33,-34 -20,-70 0,-82Z" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35" transform="rotate(45)"/>
        <path d="M0,-82 C20,-70 33,-34 25,-7 C17,8 5,6 0,-2 C-5,6 -17,8 -25,-7 C-33,-34 -20,-70 0,-82Z" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35" transform="rotate(90)"/>
        <path d="M0,-82 C20,-70 33,-34 25,-7 C17,8 5,6 0,-2 C-5,6 -17,8 -25,-7 C-33,-34 -20,-70 0,-82Z" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35" transform="rotate(135)"/>
        <path d="M0,-82 C20,-70 33,-34 25,-7 C17,8 5,6 0,-2 C-5,6 -17,8 -25,-7 C-33,-34 -20,-70 0,-82Z" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35" transform="rotate(180)"/>
        <path d="M0,-82 C20,-70 33,-34 25,-7 C17,8 5,6 0,-2 C-5,6 -17,8 -25,-7 C-33,-34 -20,-70 0,-82Z" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35" transform="rotate(225)"/>
        <path d="M0,-82 C20,-70 33,-34 25,-7 C17,8 5,6 0,-2 C-5,6 -17,8 -25,-7 C-33,-34 -20,-70 0,-82Z" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35" transform="rotate(270)"/>
        <path d="M0,-82 C20,-70 33,-34 25,-7 C17,8 5,6 0,-2 C-5,6 -17,8 -25,-7 C-33,-34 -20,-70 0,-82Z" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35" transform="rotate(315)"/>
      </g>
      <!-- Pétalas internas -->
      <g class="lotus-inner">
        <path d="M0,-52 C14,-44 22,-20 16,-3 C10,5 3,3 0,-1 C-3,3 -10,5 -16,-3 C-22,-20 -14,-44 0,-52Z" fill="#c9a227" opacity="0.1" transform="rotate(22.5)"/>
        <path d="M0,-52 C14,-44 22,-20 16,-3 C10,5 3,3 0,-1 C-3,3 -10,5 -16,-3 C-22,-20 -14,-44 0,-52Z" fill="#c9a227" opacity="0.1" transform="rotate(67.5)"/>
        <path d="M0,-52 C14,-44 22,-20 16,-3 C10,5 3,3 0,-1 C-3,3 -10,5 -16,-3 C-22,-20 -14,-44 0,-52Z" fill="#c9a227" opacity="0.1" transform="rotate(112.5)"/>
        <path d="M0,-52 C14,-44 22,-20 16,-3 C10,5 3,3 0,-1 C-3,3 -10,5 -16,-3 C-22,-20 -14,-44 0,-52Z" fill="#c9a227" opacity="0.1" transform="rotate(157.5)"/>
        <path d="M0,-52 C14,-44 22,-20 16,-3 C10,5 3,3 0,-1 C-3,3 -10,5 -16,-3 C-22,-20 -14,-44 0,-52Z" fill="#c9a227" opacity="0.1" transform="rotate(202.5)"/>
        <path d="M0,-52 C14,-44 22,-20 16,-3 C10,5 3,3 0,-1 C-3,3 -10,5 -16,-3 C-22,-20 -14,-44 0,-52Z" fill="#c9a227" opacity="0.1" transform="rotate(247.5)"/>
        <path d="M0,-52 C14,-44 22,-20 16,-3 C10,5 3,3 0,-1 C-3,3 -10,5 -16,-3 C-22,-20 -14,-44 0,-52Z" fill="#c9a227" opacity="0.1" transform="rotate(292.5)"/>
        <path d="M0,-52 C14,-44 22,-20 16,-3 C10,5 3,3 0,-1 C-3,3 -10,5 -16,-3 C-22,-20 -14,-44 0,-52Z" fill="#c9a227" opacity="0.1" transform="rotate(337.5)"/>
      </g>
      <!-- Centro -->
      <g class="lotus-center">
        <circle r="6" fill="#e8c84a" opacity="0.4" filter="url(#glowSm)"/>
        <circle r="2.5" fill="#f0d860" opacity="0.6"/>
      </g>
    </g>

    <!-- ===== ÓRBITAS NEURAIS ===== -->
    <g class="orbits">
      <ellipse rx="170" ry="68" fill="none" stroke="#c9a227" stroke-width="0.5" opacity="0.2" transform="rotate(-20)"/>
      <ellipse rx="200" ry="88" fill="none" stroke="#c9a227" stroke-width="0.35" opacity="0.12" transform="rotate(14)"/>
      <ellipse rx="232" ry="108" fill="none" stroke="#c9a227" stroke-width="0.25" opacity="0.07" transform="rotate(-7)"/>
      <circle class="synapse" cx="170" cy="0"  r="2.2" fill="#c9a227" opacity="0.3" transform="rotate(-20)"/>
      <circle class="synapse" cx="-148" cy="32" r="1.7" fill="#c9a227" opacity="0.25" transform="rotate(14)"/>
      <circle class="synapse" cx="95" cy="-58" r="1.9" fill="#e8c84a" opacity="0.2" transform="rotate(-7)"/>
      <circle class="synapse" cx="-200" cy="0" r="2" fill="#c9a227" opacity="0.2" transform="rotate(-20)"/>
      <circle class="synapse" cx="175" cy="28" r="1.4" fill="#e8c84a" opacity="0.15" transform="rotate(14)"/>
    </g>
  </g>

  <!-- ===== TEXTO ===== -->
  <g class="text-tagline">
    <rect x="60" y="68" width="10" height="10" fill="#c9a227"/>
    <text x="80" y="77" font-family="'Courier New','SF Mono','Consolas',monospace" font-size="11" fill="#8f8770" letter-spacing="3">脑机接口 · NEURAL ENGINEERING</text>
  </g>
  <g class="text-name">
    <text x="60" y="168" font-family="Georgia,'Noto Serif SC','Times New Roman',serif" font-size="72" fill="#f3ede1" letter-spacing="2">Lowingx</text>
  </g>
  <g class="text-subtitle">
    <text x="62" y="200" font-family="'Courier New','SF Mono','Consolas',monospace" font-size="12" fill="#c7bfae" letter-spacing="4">BCI · NEURAL ENGINEERING · CHINA 2028</text>
  </g>

  <!-- Linha dourada ondulada -->
  <path class="gold-line" d="M60,228 C90,217 112,239 142,228 C172,217 192,239 222,228 C252,217 272,239 302,228 C332,217 352,239 382,228 C412,217 432,239 462,228 C492,217 512,239 542,228" fill="none" stroke="url(#goldLine)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ===== SELO ===== -->
  <g class="seal">
    <rect x="1060" y="20" width="80" height="80" fill="#c9a227" rx="2"/>
    <rect x="1066" y="26" width="68" height="68" fill="none" stroke="#0a0805" stroke-width="0.8" opacity="0.25" rx="1"/>
    <text x="1100" y="63" font-family="'SimSun','Songti SC','Noto Serif SC',Georgia,serif" font-size="46" fill="#0a0805" text-anchor="middle" dominant-baseline="middle">脑</text>
  </g>

  <!-- ===== RODAPÉ ===== -->
  <text class="footer-text" x="60" y="380" font-family="'Courier New','SF Mono','Consolas',monospace" font-size="10" fill="#6f6752" letter-spacing="4">BCI ENGINEERING · CHINA · MMXXVI</text>

  <!-- Borda -->
  <rect class="border-frame" x="0.5" y="0.5" width="1199" height="399" fill="none" stroke="#c9a227" stroke-opacity="0.07" stroke-width="1"/>
</svg>
