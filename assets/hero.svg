<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code','Courier New',monospace">
  <defs>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.014"/>
    </pattern>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#c9a227" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0d878" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base: sempre visível, sem depender de animação -->
  <rect width="1200" height="400" fill="#0a0805"/>
  <rect x="10" y="10" width="1180" height="380" fill="none" stroke="#c9a227" stroke-opacity="0.22"/>
  <rect width="1200" height="400" fill="url(#scan)"/>

  <!-- ensō à direita: traço com abertura, dupla camada p/ textura de pincel -->
  <g transform="translate(950,200)">
    <g transform="rotate(-14)">
      <circle r="138" fill="none" stroke="#c9a227" stroke-width="11"
              stroke-linecap="round" stroke-dasharray="790 110"
              stroke-opacity="0.92"/>
      <circle r="132" fill="none" stroke="#c9a227" stroke-width="4"
              stroke-linecap="round" stroke-dasharray="640 190"
              stroke-opacity="0.35" transform="rotate(9)"/>
      <circle r="144" fill="none" stroke="#8a7530" stroke-width="2.5"
              stroke-linecap="round" stroke-dasharray="700 204"
              stroke-opacity="0.4" transform="rotate(-6)"/>
    </g>
    <!-- selo hanko: ouro com 脑 -->
    <g transform="translate(0,2)">
      <rect x="-44" y="-44" width="88" height="88" fill="#c9a227" rx="6"/>
      <rect x="-38" y="-38" width="76" height="76" fill="none" stroke="#0a0805" stroke-width="2" rx="3"/>
      <text x="0" y="4" text-anchor="middle" dominant-baseline="middle"
            font-family="'SimSun','Songti SC','Noto Serif SC',serif" font-size="56"
            fill="#0a0805">脑</text>
    </g>
  </g>

  <!-- texto à esquerda -->
  <text x="64" y="106" font-size="13" fill="#8f8770" letter-spacing="4">脑机接口 · NEURAL ENGINEERING</text>

  <text x="60" y="196" font-size="66" font-weight="bold" fill="#f3ede1" letter-spacing="1">Lowingx</text>
  <rect x="60" y="206" width="470" height="2" fill="#c9a227" opacity="0.55"/>
  <text x="62" y="244" font-size="13.5" fill="#c7bfae" letter-spacing="4">BCI · EMBEDDED RUST · SHENZHEN 2027</text>

  <text x="62" y="330" font-size="14" fill="#c9a227" letter-spacing="2">為學日益，為道日損。</text>
  <text x="62" y="354" font-size="11" fill="#6f6752" letter-spacing="1">in learning, add each day — in the way, subtract · 道德經 48</text>

  <!-- cursor piscando após o nome (só um extra; visível parado) -->
  <rect x="418" y="146" width="13" height="46" fill="#c9a227">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- vida: shimmer atravessa o nome; cursor pisca -->
  <g>
    <rect x="55" y="150" width="120" height="60" fill="url(#shimmer)">
      <animate attributeName="x" from="-140" to="560" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
